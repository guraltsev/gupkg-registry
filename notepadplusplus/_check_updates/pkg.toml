format = 2
description = "Source code and text editor."
project_url = "https://notepad-plus-plus.org/"
modes = ["system", "user", "portable"]

[track]
provider = "github"
repo = "notepad-plus-plus/notepad-plus-plus"
asset = "npp.${version}.portable.x64.zip"

[source]
download_url = "${asset_url}"
require = ["notepad++.exe"]

# UNVERIFIED upstream portable mechanism
[portable]
markers = [{ path = "doLocalConf.xml", content = "" }]
persist = [
    "config.xml",
    "session.xml",
    "shortcuts.xml",
    "stylers.xml",
    "contextMenu.xml",
    "userDefineLangs",
    "plugins",
    "themes",
    "backup",
]

# The vendor's portable ZIP ships `doLocalConf.xml`, which keeps the settings in the program folder; a system or user install
# must not keep it (it would lose them at every update).
[nonportable]
remove = ["doLocalConf.xml"]

[[shortcut]]
name = "Notepad++"
target = "$App\\notepad++.exe"
description = "Text and source code editor"

[[shim]]
name = "notepad++"
target = "$App\\notepad++.exe"
type = "gui"
