format = 2
description = "Handwriting notetaking and PDF annotation app."
project_url = "https://xournalpp.github.io/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/xournalpp/xournalpp/releases/download/v1.3.8/xournalpp-1.3.8-windows-portable-AMD64.zip"
sha256 = "ed85dc5765c2cea8b3f3d224bbda1dd454f197c4c938ecd939f3d922daae488d"
sha256_from = "github-digest"

[[source.extract]]
src = "xournalpp-*/"
dest = ""

[[shortcut]]
name = "Xournal++"
target = "$App\\bin\\xournalpp.exe"
description = "Handwritten notes and PDF annotation"

[[shim]]
name = "xournalpp"
target = "$App\\bin\\xournalpp.exe"
type = "gui"
