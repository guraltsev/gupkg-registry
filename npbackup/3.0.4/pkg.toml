format = 2
description = "Secure, efficient file backup built on restic with a GUI for end users and a CLI for administrators."
project_url = "https://github.com/netinvent/npbackup"
modes = ["system", "user"]

[source]
download_url = "https://github.com/netinvent/npbackup/releases/download/v3.0.4/npbackup-windows-x64-gui-public.zip"
sha256 = "9f04d726906d85fd5c948870024110df9640f0b2452f0ab5a4ed56355e4f84de"
sha256_from = "github-digest"
subdir = "npbackup-gui"
require = ["npbackup-gui.exe"]

[[shortcut]]
name = "NPbackup"
target = "$App\\npbackup-gui.exe"
working_dir = "$App"
description = "Backup system based on restic"
