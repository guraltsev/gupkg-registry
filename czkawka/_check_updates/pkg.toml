format = 2
description = "Command-line finder of duplicate files, empty folders, similar images, and more."
project_url = "https://github.com/qarmin/czkawka"
modes = ["system", "user"]

# The graphical front end is the separate `krokiet` package: a version has one download, and each program is its own release asset.
[track]
provider = "github"
repo = "qarmin/czkawka"
asset = "windows_czkawka_cli.exe"

[source]
download_url = "${asset_url}"
kind = "exe"

# GitHub redirects the download to an address that ends in a generated id, so the file is not saved under the asset name. It is the only file here.
[[prepare]]
rename = { from = "*", to = "czkawka_cli.exe" }

[[shim]]
name = "czkawka_cli"
target = "$App\\czkawka_cli.exe"
