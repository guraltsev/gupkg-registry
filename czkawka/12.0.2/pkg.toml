format = 2
description = "Finds duplicate files, empty folders, similar images, and more."
project_url = "https://github.com/qarmin/czkawka"
modes = ["system", "user"]

[source]
download_url = "https://github.com/qarmin/czkawka/releases/download/12.0.2/windows_czkawka_gui_gtk_412.zip"
sha256 = "de7e8a01cf16caf742a2da350f5c9a49477cdc75a63d05d0ea18fd1c50737285"
sha256_from = "github-digest"
require = ["czkawka_gui.exe", "krokiet.exe", "czkawka_cli.exe"]

[[shortcut]]
name = "Czkawka"
target = "$App\\czkawka_gui.exe"
description = "Duplicate and clutter finder"

[[shortcut]]
name = "Krokiet"
target = "$App\\krokiet.exe"
description = "Czkawka with the Krokiet interface"

[[shim]]
name = "czkawka_cli"
target = "$App\\czkawka_cli.exe"

[[shim]]
name = "czkawka_gui"
target = "$App\\czkawka_gui.exe"
type = "gui"

[[shim]]
name = "krokiet"
target = "$App\\krokiet.exe"
type = "gui"
