format = 2
description = "CopyQ is an advanced clipboard manager with editing and scripting features."
project_url = "https://hluk.github.io/CopyQ/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/hluk/CopyQ/releases/download/v17.0.0/copyq-17.0.0.zip"
sha256 = "1601e47339d4eda19b6f4890a00cbbe7fd00a7e5d5c3b613b9b2c8d3eeb04d19"
sha256_from = "github-digest"
strip = "auto"
require = ["copyq.exe"]

[[prepare]]
write = { path = "unins000.exe", content = "" }

[[shortcut]]
name = "CopyQ"
target = "$App\\copyq.exe"
description = "Clipboard manager"

[[shim]]
name = "copyq"
target = "$App\\copyq.exe"
type = "gui"
