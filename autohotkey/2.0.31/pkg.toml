format = 2
description = "Windows automation and hotkey scripting language."
project_url = "https://www.autohotkey.com/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31_setup.exe"
sha256 = "9224a3bd1757088320bf04c51efa43511160766bfee8d6555168293cd54b4c16"
sha256_from = "github-digest"
kind = "exe"
require = ["Compiler/Ahk2Exe.exe"]

[source.installer]
run = ["/silent", "/installto", "$Stage"]

[[shortcut]]
name = "AutoHotkey\\Ahk2Exe"
target = "$App\\Compiler\\Ahk2Exe.exe"
description = "Compile AutoHotkey scripts"

[[shim]]
name = "ahk2exe"
target = "$App\\Compiler\\Ahk2Exe.exe"
