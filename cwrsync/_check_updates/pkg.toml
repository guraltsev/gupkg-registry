format = 2
description = "Barebone rsync client for Windows from itefix, bundling rsync and ssh."
project_url = "https://itefix.net/cwrsync"
path = [
    { value = "$App\\bin" },
]
shim = [
    { name = "rsync", target = "$App\\bin\\rsync.exe" },
]

[track]
provider = "module"
module = "pkg.local/check_update.py"

[source]
download_url = "${download_url}"
shipped = false
