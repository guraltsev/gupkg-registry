format = 2
description = "Cross-platform password manager compatible with KeePass databases."
project_url = "https://keepassxc.org/"
modes = ["system", "user", "portable"]

[track]
provider = "github"
repo = "keepassxreboot/keepassxc"
# Releases up to 2.7.x name the 64-bit ZIP `-Win64.zip`; 2.8.0 renamed it `-x64.zip`.
asset = "KeePassXC-${version}-x64.zip"

[source]
download_url = "${asset_url}"

[[source.extract]]
src = "KeePassXC-*/"
dest = ""

# UNVERIFIED upstream portable mechanism
[portable]
markers = [{ path = "keepassxc.ini", content = "" }]
persist = ["keepassxc.ini"]

# The vendor ZIP ships a `.portable` file that switches KeePassXC to portable mode; a system or user install must not keep it.
[nonportable]
remove = [".portable"]

[[shortcut]]
name = "KeePassXC"
target = "$App\\KeePassXC.exe"
description = "KeePassXC password manager"
