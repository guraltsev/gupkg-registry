format = 2
description = "Open source video recording and live streaming. (portable)"
project_url = "https://obsproject.com/"
modes = ["portable"]

[source]
download_url = "https://github.com/obsproject/obs-studio/releases/download/33.0.0/OBS-Studio-33.0.0-Windows-x64.zip"
sha256 = "3369a3ecd67b5669a8a08d77357f87cc786d1fba42fbbd1054d841a69f6271a7"
sha256_from = "github-digest"
require = ["bin/64bit/obs64.exe"]

[portable]
persist = ["config"]

[[portable.markers]]
path = "portable_mode.txt"
content = ""

[[shortcut]]
name = "OBS Studio"
target = "$App\\bin\\64bit\\obs64.exe"
working_dir = "$App\\bin\\64bit"
description = "Recording and live streaming"

[[shim]]
name = "obs"
target = "$App\\bin\\64bit\\obs64.exe"
type = "gui"
