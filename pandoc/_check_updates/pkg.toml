format = 2
description = "Universal markup converter."
project_url = "https://pandoc.org/"
path = [
    { value = "$App" },
]
shim = [
    { name = "pandoc", target = "$App\\pandoc.exe" },
]

[track]
provider = "github"
repo = "jgm/pandoc"
asset = "pandoc-${version}-windows-x86_64.zip"

[source]
download_url = "${asset_url}"
shipped = false
extract = [
    { src = "pandoc-*/", dest = "" },
]
