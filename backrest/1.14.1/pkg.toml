format = 2
description = "Web UI and orchestrator for restic backup."
project_url = "https://github.com/garethgeorge/backrest"
modes = ["system", "user"]

[source]
download_url = "https://github.com/garethgeorge/backrest/releases/download/v1.14.1/backrest_Windows_x86_64.zip"
sha256 = "16b6d902303df77c14601325eada8656158e8a0531973d6094d22638ff45f545"
sha256_from = "github-digest"
require = ["backrest.exe"]

[[shortcut]]
name = "BackRest"
target = "$App\\backrest.exe"
icon_location = "$App\\backrest.exe"

[[shim]]
name = "backrest"
target = "$App\\backrest.exe"
type = "gui"
