format = 2
description = "Preservation-focused command-line transformations for LaTeX source."
project_url = "https://github.com/guraltsev/latex-toolkit"
modes = ["system", "user"]
requires_gupkg = ">=1.1.16"
# The package's own venv lives in App\.venv: the administrator (system mode) or the user
# (user mode) creates it with App\setup.cmd after each install or update. Without it the
# shims run the python first on PATH, which must have the dependencies installed.
# setup.cmd writes inside App, so App is not fingerprinted.
record_manifest = false

[track]
provider = "git"
repo_url = "git@github.com:guraltsev/latex-toolkit.git"

[source]
download_url = "git@github.com:guraltsev/latex-toolkit.git"
kind = "git"

[source.git]
commit = "${commit}"

[[shim]]
name = "lt_brace_args"
prefer_targets = ["$App\\.venv\\Scripts\\python.exe"]
target = "python"
search_path = true
arguments = ["$App\\src\\lt_brace_args.py"]

[[shim]]
name = "lt_eqnum_label"
prefer_targets = ["$App\\.venv\\Scripts\\python.exe"]
target = "python"
search_path = true
arguments = ["$App\\src\\lt_eqnum_label.py"]

