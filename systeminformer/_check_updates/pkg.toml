format = 2
description = "Free, open-source utility for monitoring system resources, processes, services, and network activity."
project_url = "https://systeminformer.sourceforge.io/"
prepare = [
    { module = "pkg.local/remove_settings.py" },
]

[track]
provider = "module"
module = "pkg.local/check_update.py"

[source]
download_url = "${download_url}"
shipped = false

[[shortcut]]
name = "Tools\\System Informer"
target = "$App\\amd64\\SystemInformer.exe"
description = "System resource and process monitor"
