format = 2
description = "ServiWin lists the installed drivers and services of the system, with file description, version, product name and company, and can start, stop and disable them. (portable)"
project_url = "https://www.nirsoft.net/utils/serviwin.html"
modes = ["portable"]

# The page says "ServiWin v1.72"; the download address has no version in it, so it stops verifying when NirSoft replaces the file.
[track]
provider = "page"
check_url = "https://www.nirsoft.net/utils/serviwin.html"
match = 'ServiWin v(?P<version>\d+(?:\.\d+)+)'
download = "https://www.nirsoft.net/utils/serviwin-x64.zip"

# The publisher gives no checksum, so the registry tool computes one.
[source]
download_url = "${download_url}"
require = ["serviwin.exe"]

# NirSoft tools keep their settings in serviwin.cfg beside the program: persisted in portable mode.
[portable]
persist = ["serviwin.cfg"]

[[shortcut]]
name = "Tools\\ServiWin"
target = "$App\\serviwin.exe"
description = "Windows services and drivers"

[[shim]]
name = "serviwin"
target = "$App\\serviwin.exe"
type = "gui"
