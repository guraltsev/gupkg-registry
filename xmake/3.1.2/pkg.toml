format = 2
description = "Cross-platform build utility based on Lua."
project_url = "https://xmake.io/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/xmake-io/xmake/releases/download/v3.1.2/xmake-master.win64.zip"
sha256 = "79670300b9d3781e7d01d684537cbbaa9d7a9e37d5406842922d92327d3f6428"
sha256_from = "github-digest"

[[source.extract]]
src = "xmake/"
dest = ""

[[path]]
value = "$App"

[[shim]]
name = "xmake"
target = "$App\\xmake.exe"
