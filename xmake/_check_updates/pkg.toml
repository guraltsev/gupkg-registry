format = 2
description = "Cross-platform build utility based on Lua."
project_url = "https://xmake.io/"
path = [
    { value = "$App" },
]
shim = [
    { name = "xmake", target = "$App\\xmake.exe" },
]

[track]
provider = "github"
repo = "xmake-io/xmake"
asset = "xmake-master.win64.zip"

[source]
download_url = "${asset_url}"
shipped = false
extract = [
    { src = "xmake/", dest = "" },
]
