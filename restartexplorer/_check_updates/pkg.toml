format = 2
description = "Restart Explorer: restarts the Windows Explorer shell, refreshes it or rebuilds the icon cache, from a shortcut or a command line."
project_url = "https://www.sordum.org/restart-explorer"
modes = ["system", "user"]

# The page is titled "Restart Explorer v1.7"; the download is the ZIP that the page's button leads to.
[track]
provider = "page"
check_url = "https://www.sordum.org/restart-explorer"
match = 'Restart Explorer v(?P<version>\d+(?:\.\d+)+)'
download = "https://www.sordum.org/files/download/restart-explorer/Rexplorer_v${version}.zip"

# The publisher gives no checksum, so the registry tool computes one.
[source]
download_url = "${download_url}"
strip = "auto"
require = ["Rexplorer_x64.exe"]

[[shortcut]]
name = "Tools\\Restart Explorer"
target = "$App\\Rexplorer_x64.exe"
description = "Restart the Explorer shell"

[[shim]]
name = "rexplorer"
target = "$App\\Rexplorer_x64.exe"
type = "gui"
