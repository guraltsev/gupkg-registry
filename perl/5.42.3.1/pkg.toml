format = 2
description = "Strawberry Perl portable distribution with a bundled C toolchain."
project_url = "https://strawberryperl.com/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip"
sha256 = "6a081a811781c30aca51dbc036afd93092af91e3297901f02c17043795a10690"
sha256_from = "github-digest"

[[shortcut]]
name = "Perl shell"
target = "$App\\portableshell.exe"
working_dir = "%USERPROFILE%"
icon_location = "$App\\win32\\strawberry.ico,0"
description = "Strawberry Perl portable shell"

[[path]]
value = "$App\\perl\\bin"

[[path]]
value = "$App\\perl\\site\\bin"

[[path]]
value = "$App\\c\\bin"

[[shim]]
name = "perl"
target = "$App\\perl\\bin\\perl.exe"
