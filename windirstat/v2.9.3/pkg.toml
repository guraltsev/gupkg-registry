format = 2
description = "Free and open-source disk-usage statistics viewer and cleanup tool for Windows."
project_url = "https://windirstat.net/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/windirstat/windirstat/releases/download/release/v2.9.3/WinDirStat.zip"
sha256 = "c980fee14389eb3a160415b0a07361900f3630f232501884863fec40f369a4a4"
sha256_from = "github-digest"
require = ["x64/WinDirStat.exe"]

[[shortcut]]
name = "Tools\\WinDirStat"
target = "$App\\x64\\WinDirStat.exe"
description = "WinDirStat disk usage statistics viewer"

[[shim]]
name = "windirstat"
target = "$App\\x64\\WinDirStat.exe"
type = "gui"
