format = 2
description = "Keyboard-driven launcher and command palette. (portable)"
project_url = "https://keypirinha.com/"
modes = ["portable"]

# The publisher provides no checksum beyond GitHub's asset digest.
[track]
provider = "github"
repo = "Keypirinha/Keypirinha"
asset = "keypirinha-${version}-x64-portable.7z"

[source]
download_url = "${asset_url}"
strip = "auto"

# UNVERIFIED upstream portable mechanism
[portable]
persist = ["portable"]

[[shortcut]]
name = "Keypirinha"
target = "$App\\keypirinha.exe"
description = "Launcher"

[[shim]]
name = "keypirinha"
target = "$App\\keypirinha.exe"
type = "gui"
