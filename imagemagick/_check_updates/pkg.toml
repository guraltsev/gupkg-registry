format = 2
description = "Command-line suite for creating, converting, and editing images."
project_url = "https://imagemagick.org/"
modes = ["system", "user"]

[track]
provider = "github"
repo = "ImageMagick/ImageMagick"
asset = "ImageMagick-${version}-portable-Q16-HDRI-x64.7z"

[source]
download_url = "${asset_url}"
strip = "auto"

[[shim]]
name = "magick"
target = "$App\\magick.exe"

[[shim]]
name = "compare"
target = "$App\\compare.exe"

[[shim]]
name = "composite"
target = "$App\\composite.exe"

[[shim]]
name = "conjure"
target = "$App\\conjure.exe"

[[shim]]
name = "identify"
target = "$App\\identify.exe"

[[shim]]
name = "mogrify"
target = "$App\\mogrify.exe"

[[shim]]
name = "montage"
target = "$App\\montage.exe"

[[shim]]
name = "stream"
target = "$App\\stream.exe"
