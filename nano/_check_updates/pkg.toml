format = 2
description = "Small, friendly command-line text editor."
project_url = "https://www.nano-editor.org/"
modes = ["system", "user"]

# The official Windows builds are single executables in one folder; the page lists them, the newest is `nano-v<version>-x64.exe`.
# The publisher gives no checksum, so the registry tool computes one.
[track]
provider = "page"
check_url = "https://www.nano-editor.org/dist/windows/"
match = 'nano-v(?P<version>\d+(?:\.\d+)+)-x64\.exe'
download = "https://www.nano-editor.org/dist/windows/nano-v${version}-x64.exe"

[source]
download_url = "${download_url}"
kind = "exe"

[[prepare]]
rename = { from = "nano-v${version}-x64.exe", to = "nano.exe" }

[[shim]]
name = "nano"
target = "$App\\nano.exe"
