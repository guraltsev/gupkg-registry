format = 2
description = "Small, friendly command-line text editor."
project_url = "https://www.nano-editor.org/"
path = [
    { value = "$App" },
]
shim = [
    { name = "nano", target = "$App\\nano.exe" },
]

[track]
provider = "github"
repo = "okibcn/nano-for-windows"
asset = "nano-for-windows_win64_v${version}.zip"

[source]
script = "pkg.local/unpack_app.py"
shipped = false
