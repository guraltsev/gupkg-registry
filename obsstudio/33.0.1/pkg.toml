format = 2
description = "Open source video recording and live streaming."
project_url = "https://obsproject.com/"
modes = ["system", "user"]

[source]
download_url = "https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip"
sha256 = "0d9436451c2d772b33428e3fdae9776f071895c335de17283176306fb72651d3"
sha256_from = "github-digest"
require = ["bin/64bit/obs64.exe"]

[[shortcut]]
name = "OBS Studio"
target = "$App\\bin\\64bit\\obs64.exe"
working_dir = "$App\\bin\\64bit"
description = "Recording and live streaming"

[[shim]]
name = "obs"
target = "$App\\bin\\64bit\\obs64.exe"
type = "gui"
