format = 2
description = "Keyboard-driven launcher and command palette."
project_url = "https://keypirinha.com/"
modes = ["system", "user", "portable"]

[source]
download_url = "https://github.com/Keypirinha/Keypirinha/releases/download/v2.26/keypirinha-2.26-x64-portable.7z"
sha256 = "d109a16e6a5cf311abf6d06bbe5b1be3b9ba323b79c32a168628189e10f102a5"
sha256_from = "registry"
strip = "auto"

[portable]
persist = ["portable"]

[user]
prepare = [
    ["remove", "portable"],
]

[system]
prepare = [
    ["remove", "portable"],
]

[[shortcut]]
name = "Keypirinha"
target = "$App\\keypirinha.exe"
description = "Launcher"

[[shim]]
name = "keypirinha"
target = "$App\\keypirinha.exe"
type = "gui"
