format = 2
description = "Goldfish Scheme, a Scheme interpreter and standard library (gf command)."
project_url = "https://github.com/MoganLab/goldfish"
path = [
    { value = "$App\\bin" },
]
shim = [
    { name = "gf", target = "$App\\bin\\gf.exe" },
]

[track]
provider = "github"
repo = "MoganLab/goldfish"
asset = "goldfish-scheme-x64-v${version}-win.zip"

[source]
download_url = "${asset_url}"
shipped = false
