format = 2
description = "Hassle-free JavaScript tool manager that pins node, npm, pnpm, and yarn per project."
project_url = "https://volta.sh/"
modes = ["system", "user"]

[track]
provider = "github"
repo = "volta-cli/volta"
asset = "volta-${version}-windows.zip"

# The GitHub asset digest is the checksum (found by the github provider).
[source]
download_url = "${asset_url}"
require = ["volta.exe", "volta-shim.exe"]

# What `volta setup` does on Windows: volta-shim.exe dispatches on the name it is launched as,
# so each tool gets its own byte-for-byte copy.
[[prepare]]
copy = { from = "volta-shim.exe", to = ["node.exe", "npm.exe", "npx.exe", "pnpm.exe", "yarn.exe"] }

# Volta keeps each user's tool shims (node, and every tool installed with `volta install`, such as tsc) in
# %LOCALAPPDATA%\Volta\bin. That folder differs for every user, so the machine PATH cannot name it, and a PATH entry written at install
# time would reach only the user who installed. So the `volta` command is a wrapper: the first time a user runs it, it runs
# `volta setup`, which puts that user's folder on that user's own PATH. This works the same for a system and a user install.
[[shim]]
name = "volta.cmd"
content = "@echo off\r\nif not exist \"%LOCALAPPDATA%\\Volta\\bin\" \"$App\\volta.exe\" setup\r\n\"$App\\volta.exe\" %*\r\nexit /b %ERRORLEVEL%\r\n"

[[shim]]
name = "node"
target = "$App\\node.exe"

[[shim]]
name = "npm"
target = "$App\\npm.exe"

[[shim]]
name = "npx"
target = "$App\\npx.exe"

[[shim]]
name = "pnpm"
target = "$App\\pnpm.exe"

[[shim]]
name = "yarn"
target = "$App\\yarn.exe"
