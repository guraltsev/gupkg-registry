format = 2
description = "Hassle-free JavaScript tool manager that pins node, npm, pnpm, and yarn per project."
project_url = "https://volta.sh/"
path = [
    { value = "$App" },
    { value = "%LOCALAPPDATA%\\Volta\\bin" },
]
shim = [
    { name = "volta", target = "$App\\volta.exe" },
]

[track]
provider = "github"
repo = "volta-cli/volta"
asset = "volta-${version}-windows.zip"

[source]
script = "pkg.local/unpack_app.py"
shipped = false
