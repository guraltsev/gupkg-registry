format = 2
description = "Mozilla Firefox web browser."
project_url = "https://www.mozilla.org/firefox/"
modes = ["system", "user"]

# Mozilla's product details name the current release; the ESR, beta and developer channels are not followed.
# The document is read as text (the json provider cannot add a suffix to the version).
# Firefox keeps its own updater, which updates App in place: the version folder names the release gupkg installed,
# with the suffix -autoupdate to say the program inside may be newer.
[track]
provider = "page"
check_url = "https://product-details.mozilla.org/1.0/firefox_versions.json"
match = '"LATEST_FIREFOX_VERSION"\s*:\s*"(?P<release>\d+(?:\.\d+)+)"'
version = "${release}-autoupdate"
download = "https://archive.mozilla.org/pub/firefox/releases/${release}/win64/en-US/Firefox%20Setup%20${release}.exe"

# The installer is a 7-Zip self-extractor; it is unpacked by the built-in service, never run. The program is its
# core\ folder (setup.exe beside it is the vendor installer and is not kept). Mozilla's SHA256SUMS is the checksum.
[source]
download_url = "${download_url}"
kind = "sfx"
subdir = "core"
require = ["firefox.exe"]

[source.checksum]
sums_file = "https://archive.mozilla.org/pub/firefox/releases/${release}/SHA256SUMS"
entry = "win64/en-US/Firefox Setup ${release}.exe"

[[shortcut]]
name = "Firefox"
target = "$App\\firefox.exe"
description = "Mozilla Firefox web browser"

# -P opens the profile selector; -no-remote makes it appear even while Firefox is running (otherwise the running
# instance only opens a window).
[[shortcut]]
name = "Firefox (profile manager)"
target = "$App\\firefox.exe"
arguments = "-P -no-remote"
description = "Choose or create a Firefox profile"

[[shim]]
name = "firefox"
target = "$App\\firefox.exe"
type = "gui"
