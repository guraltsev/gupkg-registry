format = 2
description = "Minimal, fast and customisable prompt for any shell."
project_url = "https://starship.rs/"
modes = ["system", "user"]

[track]
provider = "github"
repo = "starship/starship"
asset = "starship-x86_64-pc-windows-msvc.zip"

[source]
download_url = "${asset_url}"
require = ["starship.exe"]

[[shim]]
name = "starship"
target = "$App\\starship.exe"
