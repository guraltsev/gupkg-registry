format = 2
description = "Git for Windows portable distribution with Git Bash and the MSYS2 tool set."
project_url = "https://gitforwindows.org/"
path = [
    { value = "$App\\cmd" },
    { value = "$App\\bin" },
]
shim = [
    { name = "diff", target = "$App\\usr\\bin\\diff.exe" },
]

[track]
provider = "module"
module = "pkg.local/check_update.py"

[source]
script = "pkg.local/unpack_app.py"
shipped = false

[[shortcut]]
name = "Git bash"
target = "$App\\git-bash.exe"
working_dir = "%USERPROFILE%"
description = "Git Bash terminal"
