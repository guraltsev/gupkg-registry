format = 2
description = "Graph visualization software."
project_url = "https://graphviz.org/"
modes = ["system", "user"]

[source]
download_url = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.1/windows_10_cmake_Release_Graphviz-16.1.1-win64.zip"
sha256 = "72b1f3a9a1fd3f6e726478c1e044a95483a8fbddec13ba2fb395438d75d001b4"
sha256_from = "registry"
strip = "auto"
require = ["bin\\dot.exe"]

[[shim]]
name = "dot"
target = "$App\\bin\\dot.exe"

[[shim]]
name = "neato"
target = "$App\\bin\\neato.exe"

[[shim]]
name = "fdp"
target = "$App\\bin\\fdp.exe"

[[shim]]
name = "circo"
target = "$App\\bin\\circo.exe"

[[shim]]
name = "twopi"
target = "$App\\bin\\twopi.exe"

[[shim]]
name = "sfdp"
target = "$App\\bin\\sfdp.exe"

[[shim]]
name = "osage"
target = "$App\\bin\\osage.exe"

[[shim]]
name = "patchwork"
target = "$App\\bin\\patchwork.exe"
