format = 2
description = "Scripts that debloat and tune Windows; the project publishes no releases, so the main branch is tracked."
project_url = "https://github.com/LeDragoX/Win-Debloat-Tools"

[track]
provider = "git"
repo_url = "https://github.com/LeDragoX/Win-Debloat-Tools.git"
ref = "refs/heads/main"

[source]
download_url = "https://github.com/LeDragoX/Win-Debloat-Tools.git"
kind = "git"
shipped = false

[source.git]
ref = "refs/heads/main"
commit = "${commit}"

[[shortcut]]
name = "Win Debloat Tools"
target = "powershell.exe"
arguments = "-NoProfile -ExecutionPolicy Bypass -File \"$App\\WinDebloatTools.ps1\""
working_dir = "$App"
description = "Windows debloat and tuning scripts (run elevated)"
