format = 2
description = "Visual file and folder comparison and merge tool."
project_url = "https://winmerge.org/"
shim = [
    { name = "winmerge", target = "$App\\WinMergeU.exe", type = "gui" },
]

[track]
provider = "github"
repo = "WinMerge/winmerge"
asset = "winmerge-${version}-x64-exe.zip"

[source]
download_url = "${asset_url}"
shipped = false
extract = [
    { src = "WinMerge/", dest = "" },
]

[[shortcut]]
name = "WinMerge"
target = "$App\\WinMergeU.exe"
description = "File and folder comparison"
