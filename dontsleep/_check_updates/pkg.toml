format = 2
description = "Prevents Windows from sleeping, hibernating, shutting down, or restarting."
project_url = "https://www.softwareok.com/?Download=DontSleep"

[track]
provider = "module"
module = "pkg.local/check_update.py"

[source]
download_url = "${download_url}"
shipped = false

[[shortcut]]
name = "Dont Sleep"
target = "$App\\DontSleep_x64_p.exe"
description = "Prevent Windows from sleeping"
