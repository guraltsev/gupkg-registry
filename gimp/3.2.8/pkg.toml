format = 2
description = "GNU Image Manipulation Program, a raster graphics editor."
project_url = "https://www.gimp.org/"
modes = ["system", "user"]

[source]
download_url = "https://download.gimp.org/gimp/v3.2/windows/gimp-3.2.8-setup.exe"
sha256 = "1d78874295661d791eaf149982e9b3564888631ea29186da5ff99e8114020a5b"
sha256_from = "vendor-sums"
kind = "exe"
require = ["bin/gimp-3.exe"]

[source.installer]
run = [
    "/VERYSILENT",
    "/SUPPRESSMSGBOXES",
    "/NORESTART",
    "/SP-",
    "/CURRENTUSER",
    "/NOICONS",
    "/DIR=$Stage",
]

[[shortcut]]
name = "Gimp"
target = "$App\\bin\\gimp-3.exe"
working_dir = "%USERPROFILE%"
description = "Graphics manipulation"
