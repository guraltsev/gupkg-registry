format = 2
description = "Finds duplicate files, empty folders, similar images, and more, with a graphical interface."
project_url = "https://github.com/qarmin/czkawka"
modes = ["system", "user"]

# Krokiet is released with Czkawka. The asset names the build: the Windows one with the Skia OpenGL renderer, a single program.
[track]
provider = "github"
repo = "qarmin/czkawka"
asset = "windows_krokiet_on_windows_skia_opengl.exe"

[source]
download_url = "${asset_url}"
kind = "exe"

# GitHub redirects the download to an address that ends in a generated id, so the file is not saved under the asset name. It is the only file here.
[[prepare]]
rename = { from = "*", to = "krokiet.exe" }

[[shortcut]]
name = "Krokiet"
target = "$App\\krokiet.exe"
description = "Duplicate and clutter finder"

[[shim]]
name = "krokiet"
target = "$App\\krokiet.exe"
type = "gui"
