format = 2
description = "Vector graphics editor for illustrations, logos, and diagrams."
project_url = "https://inkscape.org/"
shim = [
    { name = "inkscape", target = "$App\\bin\\inkscape.com" },
]

[track]
provider = "module"
module = "pkg.local/check_update.py"

[source]
script = "pkg.local/unpack_app.py"
shipped = false

[[shortcut]]
name = "Inkscape"
target = "$App\\bin\\inkscape.exe"
description = "Vector graphics editor"
