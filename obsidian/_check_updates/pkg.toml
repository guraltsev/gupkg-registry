format = 2
description = "Markdown knowledge base and note-taking app."
project_url = "https://obsidian.md/"
shortcut = [
    { name = "Obsidian", target = "$App\\Obsidian.exe", description = "Markdown knowledge base" },
]

[track]
provider = "github"
repo = "obsidianmd/obsidian-releases"
asset = "Obsidian-${version}.exe"

[source]
script = "pkg.local/unpack_app.py"
shipped = false
