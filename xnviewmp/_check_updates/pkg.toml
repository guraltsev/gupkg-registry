format = 2
description = "Image viewer, browser, and converter."
project_url = "https://www.xnview.com/en/xnview-mp/"
shortcut = [
    { name = "XnView MP", target = "$App\\xnviewmp.exe", description = "Image viewer and manager" },
]
shim = [
    { name = "xnviewmp", target = "$App\\xnviewmp.exe", type = "gui" },
]

[track]
provider = "module"
module = "pkg.local/check_update.py"

[source]
download_url = "${download_url}"
shipped = false
extract = [
    { src = "XnViewMP/", dest = "" },
]
