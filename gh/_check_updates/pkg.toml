format = 2
description = "GitHub's official command-line tool."
project_url = "https://cli.github.com/"
path = [
    { value = "$App\\bin" },
]
shim = [
    { name = "gh", target = "$App\\bin\\gh.exe" },
]

[track]
provider = "github"
repo = "cli/cli"
asset = "gh_${version}_windows_amd64.zip"

[source]
download_url = "${asset_url}"
shipped = false
