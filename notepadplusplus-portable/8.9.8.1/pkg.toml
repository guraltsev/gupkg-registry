format = 2
description = "Source code and text editor. (portable)"
project_url = "https://notepad-plus-plus.org/"
modes = ["portable"]

[source]
download_url = "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.8.1/npp.8.9.8.1.portable.x64.zip"
sha256 = "beddf5548e75c97930d1575ba1c7d113e6e2b33d0a200310e734ca08e225f414"
sha256_from = "github-digest"
require = ["notepad++.exe"]

[portable]
persist = [
    "config.xml",
    "session.xml",
    "shortcuts.xml",
    "stylers.xml",
    "contextMenu.xml",
    "userDefineLangs",
    "plugins",
    "themes",
    "backup",
]

[[portable.markers]]
path = "doLocalConf.xml"
content = ""

[[shortcut]]
name = "Notepad++"
target = "$App\\notepad++.exe"
description = "Text and source code editor"

[[shim]]
name = "notepad++"
target = "$App\\notepad++.exe"
type = "gui"
