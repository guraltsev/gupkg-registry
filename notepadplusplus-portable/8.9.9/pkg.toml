format = 2
description = "Source code and text editor. (portable)"
project_url = "https://notepad-plus-plus.org/"
modes = ["portable"]

[source]
download_url = "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9/npp.8.9.9.portable.x64.zip"
sha256 = "96a8216930f5316ed5961663b2cc92a62ec7d303b6c3077b92a7cfc38a8761b7"
sha256_from = "github-digest"
require = ["notepad++.exe"]

[portable]
persist = [
    "config.xml",
    "session.xml",
    "shortcuts.xml",
    "stylers.xml",
    "contextMenu.xml",
    "userDefineLangs",
    "plugins",
    "themes",
    "backup",
]

[[portable.markers]]
path = "doLocalConf.xml"
content = ""

[[shortcut]]
name = "Notepad++"
target = "$App\\notepad++.exe"
description = "Text and source code editor"

[[shim]]
name = "notepad++"
target = "$App\\notepad++.exe"
type = "gui"
